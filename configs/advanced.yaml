# Extended training configuration with longer patience

# Data
data_dir: data/processed

# Model
gex_dim: 3000
tcr_dim: 768
vj_dim: 161
n_classes: 7

# Training (longer, more patient)
device: cuda
epochs: 100
warmup_ratio: 0.05
label_smoothing: 0.03
early_stop_patience: 20
weight_decay: 0.02

# Output
save_dir: results/ensemble_extended
