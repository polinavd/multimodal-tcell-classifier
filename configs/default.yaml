# Default ensemble training configuration

# Data
data_dir: data/processed

# Model (FullGenesVJClassifier)
gex_dim: 3000
tcr_dim: 768
vj_dim: 161
n_classes: 7

# Training
device: cuda
epochs: 70
warmup_ratio: 0.05
label_smoothing: 0.03
early_stop_patience: 12
weight_decay: 0.02

# Ensemble members: see src/training/ensemble.py for default configurations
# Override individual member configs via command-line or custom YAML

# Output
save_dir: results/ensemble
